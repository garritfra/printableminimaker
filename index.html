<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paper Mini Generator</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="title-row">
          <h1>Paper Mini Generator</h1>
          <a class="repo-link" href="https://github.com/garritfra/printableminimaker" target="_blank" rel="noopener noreferrer">View on GitHub ↗</a>
        </div>
        <p class="sub">Upload artwork, pick a size, get a print-ready PDF of foldable D&amp;D paper miniatures.</p>
      </header>

      <section class="controls">
        <label>
          Page size
          <select id="page-size">
            <option value="a4" selected>A4 (210 × 297 mm)</option>
            <option value="letter">Letter (216 × 279 mm)</option>
          </select>
        </label>
        <label class="checkbox-label" title="When a row has count > 1, label its minis 1, 2, 3, …">
          <input type="checkbox" id="number-duplicates" />
          Number duplicates
        </label>
        <button id="add-row" type="button">+ Add row</button>
        <button id="generate" type="button" disabled>Generate PDF</button>
      </section>

      <section id="rows" class="rows" aria-label="Mini entries"></section>

      <p class="hint">Tip: rectangular images work as-is. Background isn't removed in v1.</p>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
